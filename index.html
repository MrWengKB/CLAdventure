<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>文字探险</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="game">
    <header class="top">
      <h1>文字探险</h1>
      <button id="music-toggle" class="music-toggle" aria-pressed="true">🔊 音乐：开</button>
    </header>

    <section class="stats" aria-label="玩家状态">
      <div class="stat"><span class="label">天数</span><span id="stat-day" class="value">0 / 30</span></div>
      <div class="stat"><span class="label">生命</span><span id="stat-life" class="value">100 / 100</span></div>
      <div class="stat"><span class="label">防御</span><span id="stat-defense" class="value">10</span></div>
      <div class="stat"><span class="label">金币</span><span id="stat-coins" class="value">200</span></div>
      <div class="stat"><span class="label">经验</span><span id="stat-exp" class="value">0</span></div>
    </section>

    <section id="panel" class="panel" aria-live="polite"></section>

    <section class="shop" aria-label="小商店">
      <h2>小商店</h2>
      <div id="shop-items" class="shop-items"></div>
      <p id="shop-msg" class="shop-msg" aria-live="polite"></p>
    </section>

    <section class="log-wrap">
      <h2>冒险日志</h2>
      <ol id="log" class="log" reversed></ol>
    </section>
  </main>

  <div id="modal" class="modal" hidden>
    <div id="modal-box" class="modal-box" role="dialog" aria-modal="true" aria-labelledby="modal-title">
      <h2 id="modal-title"></h2>
      <p id="modal-text"></p>
      <div class="modal-actions">
        <button id="modal-close">关闭</button>
        <button id="modal-again" class="primary">再来一局</button>
      </div>
    </div>
  </div>

  <script src="js/music.js"></script>
  <script src="js/game.js"></script>
</body>
</html>
